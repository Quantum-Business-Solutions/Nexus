<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">One core. Every system attached to it.</title>
  <desc id="dsc">An isometric Nexus server core with live status lights and a spinning fan, surrounded by the eight services it runs — each hovering and linked back to the core by a live data path.</desc>

  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#26402c"/><stop offset="1" stop-color="#14261a"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3322"/><stop offset="1" stop-color="#0c1a11"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132619"/><stop offset="1" stop-color="#08120b"/>
    </linearGradient>
    <linearGradient id="pTop" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#1a3324"/><stop offset="1" stop-color="#0f2317"/>
    </linearGradient>
    <linearGradient id="pSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12291a"/><stop offset="1" stop-color="#0a1a10"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- a hovering isometric service plate -->
    <symbol id="plate" overflow="visible">
      <path d="M0,-40 L80,0 L0,40 L-80,0 Z" fill="url(#pTop)" stroke="#3f7f3a" stroke-width="1.4"/>
      <path d="M-80,0 L0,40 L0,52 L-80,12 Z" fill="url(#pSide)" stroke="#2c5f2c" stroke-width="1"/>
      <path d="M80,0 L0,40 L0,52 L80,12 Z" fill="url(#pSide)" stroke="#2c5f2c" stroke-width="1" opacity=".8"/>
      <path d="M0,-40 L80,0 L0,40 L-80,0 Z" fill="none" stroke="#8ABB2A" stroke-width="1" opacity=".32"/>
    </symbol>

    <!-- one rack unit: top face + two visible side faces + drive-bay detail -->
    <symbol id="unit" overflow="visible">
      <path d="M0,-46 L92,0 L0,46 L-92,0 Z" fill="url(#topFace)" stroke="#3c6b40" stroke-width="1.2"/>
      <path d="M-92,0 L0,46 L0,80 L-92,34 Z" fill="url(#faceL)" stroke="#33603a" stroke-width="1.1"/>
      <path d="M92,0 L0,46 L0,80 L92,34 Z" fill="url(#faceR)" stroke="#2a5231" stroke-width="1.1"/>
      <!-- drive bays on the front-right face -->
      <g stroke="#2f5c37" stroke-width="1" opacity=".85">
        <path d="M18,57 L74,29"/><path d="M18,66 L74,38"/>
      </g>
    </symbol>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="500" cy="486" rx="200" ry="52" fill="url(#shadow)"/>

  <!-- ── links from core out to every service ── -->
  <g stroke="#8ABB2A" stroke-width="1.6" fill="none" opacity=".42">
    <path d="M500,372 L500,235"/><path d="M500,372 L733,283"/>
    <path d="M500,372 L830,400"/><path d="M500,372 L733,517"/>
    <path d="M500,372 L500,565"/><path d="M500,372 L267,517"/>
    <path d="M500,372 L170,400"/><path d="M500,372 L267,283"/>
  </g>
  <!-- live traffic on the links, both directions -->
  <g fill="#d9f28f">
    <circle r="3.2"><animateMotion path="M500,372 L500,235" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M830,400 L500,372" dur="2.8s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M500,372 L500,565" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M170,400 L500,372" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M500,372 L733,283" dur="2.6s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M267,517 L500,372" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M500,372 L733,517" dur="2.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle r="3.2"><animateMotion path="M267,283 L500,372" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" font-weight="600" fill="#eaf1e0" text-anchor="middle">

    <!-- ── behind the core (drawn first). each plate hovers on its own rhythm ── -->
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.2s" repeatCount="indefinite"/>
      <use href="#plate" x="500" y="235"/><text x="500" y="181">Networking</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.6s" begin=".6s" repeatCount="indefinite"/>
      <use href="#plate" x="267" y="283"/><text x="267" y="229">Cybersecurity</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.6s" begin="1.1s" repeatCount="indefinite"/>
      <use href="#plate" x="733" y="283"/><text x="733" y="229">Managed IT</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.9s" begin="1.7s" repeatCount="indefinite"/>
      <use href="#plate" x="170" y="400"/><text x="170" y="346">Structured Cabling</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.4s" begin=".3s" repeatCount="indefinite"/>
      <use href="#plate" x="830" y="400"/><text x="830" y="346">Meeting Spaces</text></g>

    <!-- ══ THE CORE ══ -->
    <!-- ambient breathing glow -->
    <ellipse cx="500" cy="360" rx="150" ry="86" fill="#8ABB2A" filter="url(#soft)" opacity=".16">
      <animate attributeName="opacity" values=".10;.26;.10" dur="3.6s" repeatCount="indefinite"/>
    </ellipse>

    <use href="#unit" x="500" y="366"/>
    <use href="#unit" x="500" y="332"/>
    <use href="#unit" x="500" y="298"/>

    <!-- status LEDs on the front-left faces, each blinking on its own beat -->
    <g>
      <circle cx="-46" cy="0" r="0" fill="none"/>
      <g fill="#8ABB2A">
        <circle cx="452" cy="412" r="3.4"><animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite"/></circle>
        <circle cx="436" cy="404" r="3.4" fill="#d9f28f"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="452" cy="378" r="3.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/></circle>
        <circle cx="436" cy="370" r="3.4" fill="#d9f28f"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle cx="452" cy="344" r="3.4"><animate attributeName="opacity" values=".25;1;.25" dur="1.1s" repeatCount="indefinite"/></circle>
        <circle cx="436" cy="336" r="3.4" fill="#d9f28f"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- spinning fan, squashed into the isometric plane so it turns correctly -->
    <g transform="translate(500,252) scale(1,0.5)">
      <circle r="34" fill="#0b1a10" stroke="#3c6b40" stroke-width="2"/>
      <g stroke="#8ABB2A" stroke-width="5" stroke-linecap="round" opacity=".92">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
        <path d="M0,-26 A26,26 0 0,1 22,13"/>
        <path d="M22,13 A26,26 0 0,1 -22,13" opacity=".55"/>
        <path d="M-22,13 A26,26 0 0,1 0,-26" opacity=".78"/>
      </g>
      <circle r="6" fill="#d9f28f"/>
    </g>

    <text x="500" y="252" font-size="0" fill="none">core</text>
    <text x="500" y="203" font-size="12" font-weight="600" fill="#8ABB2A" letter-spacing="2.4">THE NEXUS CORE</text>

    <!-- ── in front of the core (drawn last) ── -->
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.0s" begin=".9s" repeatCount="indefinite"/>
      <use href="#plate" x="267" y="517"/><text x="267" y="592">Building Audio</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="4.4s" begin="1.5s" repeatCount="indefinite"/>
      <use href="#plate" x="733" y="517"/><text x="733" y="592">Digital Signage</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="5.8s" begin=".2s" repeatCount="indefinite"/>
      <use href="#plate" x="500" y="565"/><text x="500" y="640">Cellular</text></g>
  </g>
</svg>
