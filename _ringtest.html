<meta charset="utf-8">
<title>Nexus — rotating core ring</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a120d;color:#eaf1e0;font-family:'Instrument Sans',system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh}

  /* ── stage ─────────────────────────────────────────────────────────────── */
  .nx-ring-stage{
    position:relative;width:100%;max-width:1100px;height:620px;
    perspective:1650px;perspective-origin:50% 42%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  /* floor bloom + horizon so the ring sits in space rather than on nothing */
  .nx-ring-stage::before{
    content:"";position:absolute;left:50%;top:58%;width:900px;height:420px;
    transform:translate(-50%,-50%);pointer-events:none;
    background:radial-gradient(50% 50% at 50% 50%,rgba(138,187,42,.20),rgba(138,187,42,.05) 45%,transparent 72%);
    filter:blur(6px);
  }

  .nx-world{
    position:relative;width:340px;height:340px;
    transform-style:preserve-3d;
    transform:rotateX(-11deg);
  }

  /* ── the rotating ring ─────────────────────────────────────────────────── */
  .nx-ring{
    position:absolute;inset:0;transform-style:preserve-3d;
    animation:nx-spin 30s linear infinite;
  }
  @keyframes nx-spin{ to{ transform:rotateY(360deg) } }

  .nx-panel{
    position:absolute;left:50%;top:50%;width:188px;height:118px;
    margin:-59px 0 0 -94px;
    transform-style:preserve-3d;backface-visibility:hidden;
    border-radius:14px;padding:16px 18px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(152deg,rgba(40,66,48,.92),rgba(12,26,17,.94));
    border:1px solid rgba(138,187,42,.34);
    box-shadow:0 18px 44px -18px rgba(0,0,0,.85),
               inset 0 1px 0 rgba(216,242,143,.22);
    backdrop-filter:blur(6px);
  }
  /* specular sheen across each panel */
  .nx-panel::after{
    content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
    background:linear-gradient(118deg,rgba(216,242,143,.16) 0%,transparent 38%,transparent 100%);
  }
  .nx-panel b{
    font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;
    font-size:17px;letter-spacing:-.01em;color:#fff;line-height:1.15;position:relative;
  }
  .nx-panel i{
    font-style:normal;font-family:'Space Grotesk',monospace;font-size:10.5px;
    letter-spacing:.16em;text-transform:uppercase;color:#a8d84a;position:relative;
  }
  .nx-dot{
    position:absolute;right:16px;bottom:16px;width:7px;height:7px;border-radius:50%;
    background:#d9f28f;box-shadow:0 0 12px 3px rgba(217,242,143,.75);
    animation:nx-blink 2.6s ease-in-out infinite;
  }
  @keyframes nx-blink{0%,100%{opacity:.28}50%{opacity:1}}

  /* eight stations around the ring — radius 330px */
  .nx-panel:nth-child(1){transform:rotateY(  0deg) translateZ(430px)}
  .nx-panel:nth-child(2){transform:rotateY( 45deg) translateZ(430px)}
  .nx-panel:nth-child(3){transform:rotateY( 90deg) translateZ(430px)}
  .nx-panel:nth-child(4){transform:rotateY(135deg) translateZ(430px)}
  .nx-panel:nth-child(5){transform:rotateY(180deg) translateZ(430px)}
  .nx-panel:nth-child(6){transform:rotateY(225deg) translateZ(430px)}
  .nx-panel:nth-child(7){transform:rotateY(270deg) translateZ(430px)}
  .nx-panel:nth-child(8){transform:rotateY(315deg) translateZ(430px)}
  .nx-panel:nth-child(even) .nx-dot{animation-delay:1.1s}
  .nx-panel:nth-child(3n)  .nx-dot{animation-delay:.6s}

  /* ── the core in the middle ────────────────────────────────────────────── */
  .nx-core{
    position:absolute;left:50%;top:50%;width:226px;height:226px;margin:-113px 0 0 -113px;
    transform-style:preserve-3d;display:grid;place-items:center;
  }
  .nx-core-slab{
    width:200px;height:200px;border-radius:26px;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 26% 18%,#2c4a34,#0b1710 68%);
    border:1px solid rgba(168,216,74,.45);
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 40px 90px -30px rgba(0,0,0,.9),
               inset 0 2px 0 rgba(216,242,143,.28),
               0 0 70px -6px rgba(138,187,42,.42);
    animation:nx-breathe 5s ease-in-out infinite;
  }
  @keyframes nx-breathe{
    0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 90px -30px rgba(0,0,0,.9),
            inset 0 2px 0 rgba(216,242,143,.28),0 0 60px -10px rgba(138,187,42,.34)}
    50%   {box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 90px -30px rgba(0,0,0,.9),
            inset 0 2px 0 rgba(216,242,143,.28),0 0 96px 2px rgba(138,187,42,.58)}
  }
  .nx-core-logo{width:132px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 18px rgba(138,187,42,.5))}
  .nx-core-mark{
    font-family:'Manrope',system-ui,sans-serif;font-weight:800;font-size:34px;
    letter-spacing:-.03em;color:#fff;text-align:center;line-height:1;
  }
  .nx-core-sub{
    font-family:'Space Grotesk',monospace;font-size:9.5px;letter-spacing:.24em;
    text-transform:uppercase;color:#a8d84a;margin-top:9px;text-align:center;
  }
  /* concentric guide rings, lying flat in the ring's plane */
  .nx-halo{
    position:absolute;left:50%;top:50%;border:1px solid rgba(138,187,42,.16);
    border-radius:50%;transform-style:preserve-3d;pointer-events:none;
  }
  .nx-halo.a{width:760px;height:760px;margin:-380px 0 0 -380px;transform:rotateX(90deg)}
  .nx-halo.b{width:600px;height:600px;margin:-300px 0 0 -300px;transform:rotateX(90deg);
             border-color:rgba(138,187,42,.10)}

  .nx-cap{
    position:absolute;left:0;right:0;bottom:14px;text-align:center;
    font-family:'Space Grotesk',monospace;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(168,216,74,.7);
  }

  /* pause for anyone who asked their OS to stop motion */
  @media (prefers-reduced-motion:reduce){
    .nx-ring,.nx-core-slab,.nx-dot{animation:none}
    .nx-ring{transform:rotateY(-18deg)}
  }
  @media (max-width:820px){
    .nx-ring-stage{height:470px;perspective:1100px}
    .nx-panel{width:168px;height:110px;margin:-55px 0 0 -84px}
    .nx-panel:nth-child(1){transform:rotateY(  0deg) translateZ(250px)}
    .nx-panel:nth-child(2){transform:rotateY( 45deg) translateZ(250px)}
    .nx-panel:nth-child(3){transform:rotateY( 90deg) translateZ(250px)}
    .nx-panel:nth-child(4){transform:rotateY(135deg) translateZ(250px)}
    .nx-panel:nth-child(5){transform:rotateY(180deg) translateZ(250px)}
    .nx-panel:nth-child(6){transform:rotateY(225deg) translateZ(250px)}
    .nx-panel:nth-child(7){transform:rotateY(270deg) translateZ(250px)}
    .nx-panel:nth-child(8){transform:rotateY(315deg) translateZ(250px)}
    .nx-halo.a{width:560px;height:560px;margin:-280px 0 0 -280px}
    .nx-halo.b{width:440px;height:440px;margin:-220px 0 0 -220px}
  }
</style>

<div class="nx-ring-stage">
  <div class="nx-world">
    <div class="nx-halo a"></div>
    <div class="nx-halo b"></div>

    <div class="nx-ring">
      <div class="nx-panel"><i>01</i><b>Managed IT</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>02</i><b>Cybersecurity</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>03</i><b>Networking</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>04</i><b>Meeting Spaces</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>05</i><b>Digital Signage</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>06</i><b>Building Audio</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>07</i><b>Cellular</b><span class="nx-dot"></span></div>
      <div class="nx-panel"><i>08</i><b>Structured Cabling</b><span class="nx-dot"></span></div>
    </div>

    <div class="nx-core">
      <div class="nx-core-slab">
        <div>
          <img class="nx-core-logo" src="assets/nexus/nexus-logo-white.png" alt="Nexus">
          <div class="nx-core-sub">the core</div>
        </div>
      </div>
    </div>
  </div>
  <div class="nx-cap">One core · every system attached to it</div>
</div>
